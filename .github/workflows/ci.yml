name: CI

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Install dis-vulncheck
        run: go install github.com/ONSdigital/dis-vulncheck@latest
      - name: Run audit
        run: make audit

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run Go lint checks
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version-file: '.golangci-lint-version'

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run Go unit tests
        run: |
          set -o pipefail
          go test -race -coverprofile=coverage.out -covermode=atomic ./... 2>&1 | tee go-test.out
      - name: Generate coverage summary
        if: always()
        run: |
          echo "## Test Coverage" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f go-test.out ]; then
            echo "| Package | Coverage |" >> $GITHUB_STEP_SUMMARY
            echo "|---------|----------|" >> $GITHUB_STEP_SUMMARY
            awk '
              /coverage:[[:space:]]+[0-9.]+%[[:space:]]+of[[:space:]]+statements/ {
                pkg = ""
                cov = ""

                if ($1 == "ok" || $1 == "FAIL") {
                  pkg = $2
                } else {
                  pkg = $1
                }

                for (i = 1; i <= NF; i++) {
                  if ($i == "coverage:") {
                    cov = $(i + 1)
                    break
                  }
                }

                if (pkg != "" && cov != "") {
                  printf("| `%s` | %s |\n", pkg, cov)
                }
              }
            ' go-test.out >> $GITHUB_STEP_SUMMARY
          else
            echo "No go test output found." >> $GITHUB_STEP_SUMMARY
          fi

          if [ -f coverage.out ]; then
            total_cov=$(go tool cover -func=coverage.out | awk '/^total:/{print $3}')
            if [ -n "$total_cov" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "**Total coverage: ${total_cov}**" >> $GITHUB_STEP_SUMMARY
            fi
          fi

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: 'go.mod'
          cache: true
      - name: Run Go build
        run: make build
