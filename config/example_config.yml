## Example config file - replace fields as required
##
dp-setup-path: "~/src/github.com/ONSdigital/dp-setup"                         # path to dp-setup                repo
dp-nisra-path: "~/src/github.com/ONSdigital/dp-nisra-infrastructure"          # path to dp-nisra-infrastructure repo
dp-ci-path: "~/src/github.com/ONSdigital/dp-ci"                               # path to dp-ci                   repo
dp-hierarchy-builder-path: "~/src/github.com/ONSdigital/dp-hierarchy-builder" # path to dp-hierarchy-builder    repo
dp-code-list-scripts-path: "~/src/github.com/ONSdigital/dp-code-list-scripts" # path to dp-code-list-scripts    repo
dp-cli-path: "~/src/github.com/ONSdigital/dp-cli"                             # path to dp-cli                  repo

user-name: ChangeMe # change me to YourName (e.g. JaneDoe)
ssh-user: ubuntu

# Profile suffixes map role names to AWS profile name suffixes.
# These are appended to the base environment profile to form the full profile name.
# e.g. base "dp-sandbox" + suffix "-view-only" = "dp-sandbox-view-only"
#
# Your ~/.aws/config should have corresponding profiles for each environment + suffix combination.
# See the README for full AWS config setup instructions.
profile-suffixes:
  view: "-view-only"
  engineer: "-engineer"
  admin: "-admin"

# Command privileges map dp-cli commands to their minimum required role.
# The resolved profile will be: <env-profile><suffix-for-role>
# Commands not listed here will use the base environment profile (backwards compatible).
command-privileges:
  remote.allow: view
  remote.deny: view
  eks.session.start: view
  eks.session.stop: view
  eks.session.status: view
  ssh.list: view
  ssh: engineer
  scp.list: view
  scp: engineer

# EKS tunnel settings (all optional, defaults shown)
eks:
  tunnel-box-role-tag: "session-tunnel-box"
  cluster-access-tag: "ssm-tunnel-access"
  # Directory for local tunnel state files. Default is under /tmp so it is
  # ephemeral and cleared on reboot. Set a persistent path if you prefer state
  # to survive reboots (e.g. "~/.dp-cli/eks-tunnels").
  state-dir: "/tmp/eks-tunnels-ssm"
  # Local port range for SSM port-forwards (inclusive). One port is used per
  # active cluster tunnel.
  base-port: 9443
  max-port: 9500

# uncomment more environments when you get (AWS) access to them
environments:
  - name: bleed
    profile: dp-bleed-dev
  - name: sandbox
    profile: dp-sandbox
  # - name: staging
  #   profile: dp-staging
  #   tags: [secure]
  # - name: prod
  #   profile: dp-prod
  #   tags: [live,secure]
  # - name: ci
  #   profile: dp-ci
  #   tags: [ci]
  # - name: nisra-dev
  #   profile: nisra-dev
  #   tags: [nisra]
  # - name: nisra-prod
  #   profile: nisra-prod
  #   tags: [nisra,live,secure]

cmd:
  neo4j-url: bolt://localhost:7687
  mongo-url: localhost:27017
  mongo-dbs: # The mongo databases to be dropped when cleaning your CMD data
    - "imports"
    - "datasets"
    - "filters"
    - "codelists"
    - "test"
  hierarchies: # The hierarchies import scripts to run when importing CMD data
    - "admin-geography.cypher"
    - "cpih1dim1aggid.cypher"
    - "mid-year-pop-geography.cypher"

  codelists: # The codelist import scripts to run when importing CMD data
    - "cpih.yaml"
    - "mid-year-pop-est.yaml"
